name: Dependency Graph Pages

on:
  workflow_run:
    workflows: ["Lean Action CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install -r scripts/requirements.txt

      - name: Key of the grid
        id: plan
        run: python scripts/ci_grid.py plan

      - uses: ./.github/actions/mlc-env
        with:
          free-disk: "true"

      # The CI run that triggered this one has saved the tiles in the cache.
      - name: Tiles from the cache or the seed
        uses: ./.github/actions/mlc-tiles
        with:
          key: ${{ steps.plan.outputs.key }}

      - name: Build Mlc
        run: make build

      - name: Generate dependency graph site
        run: python scripts/generate_dependency_graph_site.py --output site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
