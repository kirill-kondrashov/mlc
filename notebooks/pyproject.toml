[project]
name = "mlc-notebooks"
version = "0.1.0"
description = "Local notebook environment for MLC exploratory notebooks"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6,<5",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "notebook>=7.4,<8",
    "numpy>=2.2,<3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
